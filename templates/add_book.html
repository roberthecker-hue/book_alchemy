{% extends "base.html" %}

{% block title %}Buch hinzufügen - BookAlchemy{% endblock %}

{% block content %}
    <h3 style="font-size: 1.1rem; color: var(--text-dark); font-weight: 700; margin-bottom: 20px;">Neues Buch hinzufügen</h3>

    <form method="POST" style="max-width: 420px;">
        <div style="margin-bottom: 14px;">
            <label for="title" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Titel:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div style="margin-bottom: 14px;">
            <label for="isbn" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">ISBN:</label>
            <input type="text" id="isbn" name="isbn" required>
        </div>

        <div style="margin-bottom: 14px;">
            <label for="publication_year" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Erscheinungsjahr:</label>
            <input type="number" id="publication_year" name="publication_year">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="author_id" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Autor auswählen:</label>
            <select id="author_id" name="author_id" required>
                <option value="">-- Bitte wählen --</option>
                {% for author in authors %}
                    <option value="{{ author.id }}">{{ author.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Buch speichern</button>
    </form>
{% endblock %}
