<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Buch hinzufügen</title>
</head>
<body>
    <p><a href="/">← Zurück zur Bibliothek</a></p>
    <h1>Neues Buch hinzufügen</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: green;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Titel:</label><br>
        <input type="text" name="title" required><br><br>

        <label>ISBN:</label><br>
        <input type="text" name="isbn" required><br><br>

        <label>Erscheinungsjahr:</label><br>
        <input type="number" name="publication_year"><br><br>

        <label>Autor auswählen:</label><br>
        <select name="author_id" required>
            <option value="">-- Bitte wählen --</option>
            {% for author in authors %}
                <option value="{{ author.id }}">{{ author.name }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Buch speichern</button>
    </form>
</body>
</html>
