<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buch hinzufügen</title>
</head>
<body>
    <p><a href="{{ url_for('home') }}">← Zurück zur Bibliothek</a></p>
    <h1>Neues Buch hinzufügen</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul style="list-style: none; padding: 0;">
        {% for category, message in messages %}
          <li style="color: {% if category == 'error' %}red{% else %}green{% endif %}; font-weight: bold;">
            {{ message }}
          </li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div>
            <label for="title">Titel:</label><br>
            <input type="text" id="title" name="title" required>
        </div><br>

        <div>
            <label for="isbn">ISBN:</label><br>
            <input type="text" id="isbn" name="isbn" required>
        </div><br>

        <div>
            <label for="publication_year">Erscheinungsjahr:</label><br>
            <input type="number" id="publication_year" name="publication_year">
        </div><br>

        <div>
            <label for="author_id">Autor auswählen:</label><br>
            <select id="author_id" name="author_id" required>
                <option value="">-- Bitte wählen --</option>
                {% for author in authors %}
                    <option value="{{ author.id }}">{{ author.name }}</option>
                {% endfor %}
            </select>
        </div><br>

        <button type="submit">Buch speichern</button>
    </form>
</body>
</html>
