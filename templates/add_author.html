{% extends "base.html" %}

{% block title %}Autor hinzufügen - BookAlchemy{% endblock %}

{% block content %}
    <h3 style="font-size: 1.1rem; color: var(--text-dark); font-weight: 700; margin-bottom: 20px;">Neuen Autor hinzufügen</h3>

    <form method="POST" style="max-width: 420px;">
        <div style="margin-bottom: 14px;">
            <label for="name" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div style="margin-bottom: 14px;">
            <label for="birthdate" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Geburtsdatum:</label>
            <input type="date" id="birthdate" name="birthdate">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="date_of_death" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Todesdatum (falls zutreffend):</label>
            <input type="date" id="date_of_death" name="date_of_death">
        </div>

        <button type="submit" class="btn" style="width: 100%;">Autor speichern</button>
    </form>
{% endblock %}
