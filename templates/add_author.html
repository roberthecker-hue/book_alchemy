<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Autor hinzufügen</title>
</head>
<body>
    <p><a href="/">← Zurück zur Bibliothek</a></p>
    <h1>Neuen Autor hinzufügen</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: green;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Geburtsdatum:</label><br>
        <input type="date" name="birthdate"><br><br>

        <label>Todesdatum (falls zutreffend):</label><br>
        <input type="date" name="date_of_death"><br><br>

        <button type="submit">Autor speichern</button>
    </form>
</body>
</html>
